apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: deepseek-r1-distill-qwen-1dot5b-model-gpu-0
  namespace: scheduler
  annotations:
    serving.kserve.io/enable-prometheus-scraping: "true"
    serving.kserve.io/enable-metric-aggregation: "true"   # 可选：让 KServe 聚合 queue-proxy + model 的指标
    prometheus.io/port: "8080"   
    prometheus.io/path: "/metrics"
    prometheus.io/scrape: "true"
    nvidia.com/use-gpuuuid: "GPU-36fa2eff-68bc-ba6c-1f05-28a35db98afc"
    serving.kserve.io/autoscalerClass: "external"
spec:
  predictor:
    minReplicas: 1  # 设置为您需要的副本数
    maxReplicas: 5
    model:
      modelFormat:
        name: huggingface
      storageUri: "pvc://deepseek-1dot5b-model-pvc"
      args:
        - --model_name=DeepSeek-R1-Distill-Qwen-1.5B
        - --model_id=/mnt/models
      env:
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: HF_HUB_OFFLINE
          value: "1"
      resources:
        limits:
          cpu: "2"
          memory: "16Gi"
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 10000
        requests:
          cpu: "1"
          memory: "10Gi"
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 10000
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/disk-pressure"
        operator: "Exists"
        effect: "NoSchedule"